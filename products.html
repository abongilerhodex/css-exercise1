<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Products</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="page-header">
    <h1>Products on sale!</h1>
  </header>

  <main class="product-grid">
    <article class="product-card">
      <img src="images/download.jpg" alt="Smartphone" class="product-image">
      <h2 class="product-title">Smartphone</h2>
      <p class="product-price">R999.99</p>
      <button class="add-to-cart-btn">Add to Cart</button>
    </article>

    <article class="product-card">
      <img src="images/download.jpg" alt="Smart Watch" class="product-image">
      <h2 class="product-title">Smart Watch</h2>
      <p class="product-price">R299.99</p>
      <button class="add-to-cart-btn">Add to Cart</button>
    </article>

    <article class="product-card">
      <img src="images/download.jpg" alt="Headphones" class="product-image">
      <h2 class="product-title">Headphones</h2>
      <p class="product-price">R199.99</p>
      <button class="add-to-cart-btn">Add to Cart</button>
    </article>

    <article class="product-card">
      <img src="images/download.jpg" alt="Laptop" class="product-image">
      <h2 class="product-title">Laptop</h2>
      <p class="product-price">R4999.99</p>
      <button class="add-to-cart-btn">Add to Cart</button>
    </article>

    <article class="product-card">
      <img src="images/download.jpg" alt="Laptop charger" class="product-image">
      <h2 class="product-title">Laptop charger</h2>
      <p class="product-price">R899.99</p>
      <button class="add-to-cart-btn">Add to Cart</button>
    </article>
   
    <article class="product-card">
      <img src="images/download.jpg" alt="USB-128gb" class="product-image">
      <h2 class="product-title">USB-128gb</h2>
      <p class="product-price">R159.99</p>
      <button class="add-to-cart-btn">Add to Cart</button>
    </article>
  </main>

</body>
</html>
